models:
  - name: stg_jaffle_shop__customers
    description: Staged customer data from our jaffle shop app. One unique customer per row.
    columns:
      - name: customer_id
        description: primary key
        data_tests:
          - unique
          - not_null
  
  - name: stg_jaffle_shop__orders
    description: Staged order data from our jaffle shop app. One unique order per row.
    columns:
      - name: order_id
        description: primary key
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['return_pending', 'returned', 'completed', 'placed', 'shipped']
      - name: customer_id
        description: Foreign key to stg_customers.customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id