sources:
  - name: jaffle_shop
    database: analytics
    schema: jaffle_shop
    tables:
      - name: customers
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: orders
        config:
          loaded_at_field: _etl_loaded_at
          freshness:
            warn_after:
              count: 3
              period: day
            error_after:
              count: 7
              period: day
